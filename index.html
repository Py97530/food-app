<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>食光 · 健康饮食助手</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食光">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  /* ================================================================
     🥗 食光 — Design System v3.0
     方向：有机自然感 · Organic Warmth
     设计规范：ui-design / color-theory / web-typography / visual-direction
     ================================================================ */

  /* ---------- RESET ---------- */
  *{margin:0;padding:0;box-sizing:border-box}

  /* ---------- DESIGN TOKENS — 鲜活自然 ---------- */
  :root{
    /* ◆ Primary — 番茄珊瑚 (tomato coral) */
    --p-50:#fff5f2;  --p-100:#ffe8e0; --p-200:#ffd1c2;
    --p-300:#ffb39a; --p-400:#ff8f6b; --p-500:#ff6b4a; /* ← 主色 */
    --p-600:#e85d3a; --p-700:#c44a2c; --p-800:#9e3820;
    --p-900:#772714;

    /* ◆ Accent — 牛油果绿 (avocado green) */
    --a-50:#f4f9ee;  --a-100:#e6f2d8; --a-200:#cde6b0;
    --a-300:#add582; --a-400:#8cc555; --a-500:#7cb342;
    --a-600:#649632; --a-700:#4e7826; --a-800:#3a5b1c;
    --a-900:#273e12;

    /* ◆ Neutral — 暖奶油 (warm cream) */
    --n-50:#fffdf9;  --n-100:#fff9f0; --n-200:#faf0e0;
    --n-300:#f0e2cc; --n-400:#d4c4a8; --n-500:#a89880;
    --n-600:#8b7a62; --n-700:#6b5c48; --n-800:#4a3e2e;
    --n-900:#2d2416;

    /* ◆ Semantic */
    --success:#5a9e4b; --warning:#f0a060; --error:#e0554a;
    --info:#5b8cce;

    /* ◆ Aliases — 语义化引用 */
    --color-primary:var(--p-500);
    --color-primary-hover:var(--p-600);
    --color-primary-light:var(--p-50);
    --color-accent:var(--a-500);
    --color-bg:var(--n-100);
    --color-surface:#fff;
    --color-text:var(--n-800);
    --color-text-secondary:var(--n-500);
    --color-text-muted:var(--n-400);
    --color-border:var(--n-200);
    --color-border-strong:var(--n-300);

    /* ◆ Spacing — 8px baseline grid */
    --space-1:4px;  --space-2:8px;  --space-3:12px;
    --space-4:16px; --space-5:20px; --space-6:24px;
    --space-8:32px; --space-10:40px; --space-12:48px;
    --space-16:64px; --space-20:80px;

    /* ◆ Typography — Major Third scale */
    --font-sans:'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,sans-serif;
    --text-xs:0.75rem;    --text-sm:0.8125rem;  --text-base:1rem;
    --text-lg:1.125rem;   --text-xl:1.25rem;    --text-2xl:1.5rem;
    --text-3xl:1.75rem;   --text-4xl:2rem;
    --leading-body:1.7;
    --leading-heading:1.3;
    --leading-tight:1.15;

    /* ◆ Border Radius */
    --radius-sm:10px; --radius-md:14px;
    --radius-lg:18px; --radius-xl:22px; --radius-full:9999px;

    /* ◆ Shadows — warm feel */
    --shadow-xs:0 1px 2px rgba(80,50,20,.03);
    --shadow-sm:0 1px 3px rgba(80,50,20,.04),0 1px 2px rgba(80,50,20,.03);
    --shadow-md:0 4px 16px rgba(80,50,20,.06),0 1px 2px rgba(80,50,20,.03);
    --shadow-lg:0 8px 28px rgba(80,50,20,.08),0 2px 8px rgba(80,50,20,.04);
    --shadow-xl:0 16px 48px rgba(80,50,20,.14);

    /* ◆ Transitions */
    --ease-out:0.2s cubic-bezier(0.4,0,0.2,1);
    --ease-bounce:0.3s cubic-bezier(0.34,1.56,0.64,1);

    /* ◆ Legacy compat */
    --g:var(--p-400);--gd:var(--p-600);--bg:var(--n-100);
    --card:#fff;--t:var(--n-800);--tl:var(--n-500);
    --b:var(--n-200);--warn:var(--warning);--red:var(--error);
  }

  /* ---------- BASE ---------- */
  body{
    font-family:var(--font-sans);
    font-size:var(--text-base);
    line-height:var(--leading-body);
    background:linear-gradient(180deg,var(--n-50) 0%,var(--n-100) 50%,#faf5ec 100%);
    color:var(--color-text);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }

  /* ---------- NAVIGATION ---------- */
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:var(--space-3) var(--space-5);
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    border-bottom:1px solid var(--color-border);
    position:sticky;top:0;z-index:100;
  }
  .logo{
    font-size:var(--text-xl);font-weight:800;letter-spacing:-0.02em;
    background:linear-gradient(135deg,var(--p-500),var(--p-700));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .nav-actions{display:flex;gap:var(--space-2)}
  .nav-btn{
    font-size:1.25rem;cursor:pointer;background:none;border:none;
    padding:var(--space-1) var(--space-2);
    display:flex;flex-direction:column;align-items:center;gap:1px;
    border-radius:var(--radius-sm);transition:all var(--ease-out);
  }
  .nav-btn:hover{background:var(--p-50)}
  .nav-btn span{font-size:0.6rem;font-weight:700;color:var(--color-text-secondary);letter-spacing:0.02em}
  .nav-btn.cal-on span{color:var(--p-500)}

  /* ---------- CONTAINER ---------- */
  .container{max-width:1200px;margin:0 auto;padding:var(--space-5)}

  /* ---------- SEARCH BOX ---------- */
  .search-box{
    background:var(--color-surface);
    border-radius:var(--radius-lg);
    padding:var(--space-5);
    box-shadow:var(--shadow-sm);
    border:1.5px solid var(--color-border);
    margin-bottom:var(--space-4);
    transition:box-shadow var(--ease-out),border-color var(--ease-out);
  }
  .search-box:focus-within{
    box-shadow:var(--shadow-md),0 0 0 4px var(--p-100);
    border-color:var(--p-300);
  }
  .input-row{display:flex;gap:var(--space-2)}
  .input-row input{
    flex:1;padding:var(--space-3) var(--space-4);
    border:1.5px solid var(--color-border);
    border-radius:var(--radius-md);
    font-size:var(--text-base);font-family:inherit;
    background:var(--color-bg);outline:none;min-width:0;
    transition:border-color var(--ease-out),box-shadow var(--ease-out);
  }
  .input-row input:focus{
    border-color:var(--p-400);
    box-shadow:0 0 0 4px var(--p-100);
  }
  .input-row input::placeholder{color:var(--color-text-muted)}
  .input-row button{
    padding:var(--space-3) var(--space-6);
    background:linear-gradient(135deg,var(--p-500),var(--p-600));
    color:#fff;border:none;border-radius:var(--radius-md);
    font-size:var(--text-base);font-weight:700;
    cursor:pointer;font-family:inherit;white-space:nowrap;
    letter-spacing:0.01em;
    box-shadow:0 2px 8px rgba(255,107,74,.25);
    transition:transform var(--ease-bounce),box-shadow var(--ease-out),opacity var(--ease-out);
  }
  .input-row button:hover{
    box-shadow:0 4px 16px rgba(255,107,74,.35);
    transform:translateY(-1px);
  }
  .input-row button:active{transform:scale(.96) translateY(0)}
  .input-row button:disabled{opacity:.5;pointer-events:none;transform:none;box-shadow:none}

  .quick-tags{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-3)}
  .quick-tag{
    padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);
    font-size:var(--text-sm);border:1.5px solid var(--color-border);
    background:var(--color-surface);cursor:pointer;
    color:var(--color-text-secondary);font-family:inherit;font-weight:500;
    transition:all var(--ease-bounce);
  }
  .quick-tag:hover{
    border-color:var(--p-300);color:#fff;
    background:linear-gradient(135deg,var(--p-500),var(--p-600));
    box-shadow:0 2px 8px rgba(255,107,74,.2);
    transform:translateY(-1px);
  }
  .quick-tag:active{transform:scale(.94)}

  /* ---------- BODY TEXTURE ---------- */
  body::before{
    content:;position:fixed;inset:0;z-index:-1;opacity:.03;pointer-events:none;
    background-image:
      repeating-linear-gradient(45deg,var(--p-400) 0px,var(--p-400) 1px,transparent 1px,transparent 14px),
      repeating-linear-gradient(-45deg,var(--p-400) 0px,var(--p-400) 1px,transparent 1px,transparent 14px),
      radial-gradient(ellipse 600px 400px at 85% 5%,var(--p-100) 0%,transparent 70%),
      radial-gradient(ellipse 500px 300px at 15% 90%,var(--a-50) 0%,transparent 70%);
  }

  /* ---------- INGREDIENT MARKET ---------- */
  .ingredient-market{margin-bottom:var(--space-4)}
  .market-header{
    display:flex;align-items:center;gap:var(--space-3);
    margin-bottom:var(--space-4);
  }
  .market-header-icon{
    font-size:2.2rem;line-height:1;
    animation:gentleFloat 3s ease-in-out infinite;
  }
  .market-header-text h2{
    font-size:var(--text-xl);font-weight:800;color:var(--color-text);
    letter-spacing:-0.01em;
  }
  .market-header-text p{
    font-size:var(--text-sm);color:var(--color-text-muted);margin-top:2px;
  }
  .market-header-text::after{
    content:"";display:block;width:40px;height:3px;margin-top:var(--space-1);
    border-radius:var(--radius-full);
    background:linear-gradient(90deg,var(--p-500),var(--a-500),var(--warning));
  }

  /* Trending strip */
  .trending-strip{
    display:flex;gap:var(--space-2);overflow-x:auto;
    padding:var(--space-2) 0 var(--space-3);
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .trending-strip::-webkit-scrollbar{display:none}
  .trending-item{
    flex-shrink:0;padding:var(--space-1) var(--space-3);
    background:linear-gradient(135deg,var(--p-50),var(--p-100));
    border-radius:var(--radius-full);
    font-size:var(--text-xs);font-weight:600;color:var(--p-700);
    white-space:nowrap;cursor:pointer;
    transition:all var(--ease-bounce);
    border:1.5px solid transparent;
  }
  .trending-item:hover{
    background:linear-gradient(135deg,var(--p-500),var(--p-600));
    color:#fff;transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(255,107,74,.25);
  }

  /* Category sections */
  .ingredient-category{margin-bottom:var(--space-5)}
  .category-label{
    display:flex;align-items:center;gap:var(--space-2);
    font-size:var(--text-sm);font-weight:700;color:var(--color-text-secondary);
    margin-bottom:var(--space-3);padding-left:var(--space-1);
  }
  .category-label .cat-icon{font-size:1.1rem}

  /* Ingredient grid & cards */
  .category-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);
  }
  .ingredient-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:var(--space-4) var(--space-2);
    background:var(--color-surface);
    border-radius:var(--radius-lg);
    border:1.5px solid var(--color-border);
    cursor:pointer;
    transition:transform var(--ease-bounce),box-shadow var(--ease-out),border-color var(--ease-out);
    box-shadow:var(--shadow-xs);
    animation:cardPopIn .4s var(--ease-bounce) both;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .ingredient-card:active{
    transform:scale(.92);box-shadow:var(--shadow-md);
    border-color:var(--p-300);
  }
  .ingredient-card .ing-emoji{
    font-size:2.2rem;line-height:1;margin-bottom:var(--space-1);
    animation:gentleFloat 3.5s ease-in-out infinite;
  }
  .ingredient-card .ing-name{
    font-size:var(--text-sm);font-weight:700;color:var(--color-text);
  }
  .ingredient-card .ing-tags{
    font-size:.6rem;color:var(--color-text-muted);margin-top:2px;
    text-align:center;line-height:1.3;
  }
  /* Category accent borders */
  .ingredient-category[data-cat=vegetables] .ingredient-card{border-top:3px solid var(--a-400)}
  .ingredient-category[data-cat=proteins] .ingredient-card{border-top:3px solid var(--p-400)}
  .ingredient-category[data-cat=fruits] .ingredient-card{border-top:3px solid var(--warning)}
  .ingredient-category[data-cat=grains] .ingredient-card{border-top:3px solid #d4a853}
  .ingredient-category[data-cat=seasoning] .ingredient-card{border-top:3px solid var(--p-300)}

  @keyframes gentleFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
  }
  @keyframes cardPopIn{
    from{opacity:0;transform:translateY(14px) scale(.9)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes slideInRight{
    from{opacity:0;transform:translateX(20px)}
    to{opacity:1;transform:translateX(0)}
  }

  /* Filter empty state */
  .filter-empty{
    text-align:center;padding:var(--space-8) var(--space-5);
  }
  .filter-empty-icon{font-size:3rem;margin-bottom:var(--space-3)}
  .filter-empty p{
    color:var(--color-text-muted);font-size:var(--text-base);margin-bottom:var(--space-4);
  }
  .filter-empty button{
    padding:var(--space-3) var(--space-6);
    background:linear-gradient(135deg,var(--p-500),var(--p-600));
    color:#fff;border:none;border-radius:var(--radius-full);
    font-size:var(--text-base);font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:0 2px 8px rgba(255,107,74,.25);
    transition:all var(--ease-bounce);
  }
  .filter-empty button:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(255,107,74,.35)}

  /* Question sheet modal */
  .question-sheet .modal-sheet{padding-bottom:var(--space-8)}
  .question-sheet-ingredient{
    text-align:center;padding:var(--space-6) 0 var(--space-2);
  }
  .question-sheet-ingredient .ing-emoji{font-size:3.5rem;line-height:1}
  .question-sheet-ingredient .ing-name{
    font-size:var(--text-xl);font-weight:800;margin-top:var(--space-2);
  }
  .question-chip{
    display:block;width:100%;padding:var(--space-4) var(--space-4);
    margin-bottom:var(--space-2);
    background:var(--color-bg);border:1.5px solid var(--color-border);
    border-radius:var(--radius-md);
    font-size:var(--text-base);font-family:inherit;
    cursor:pointer;text-align:left;
    transition:all var(--ease-bounce);
    color:var(--color-text);
  }
  .question-chip:hover{
    background:var(--p-50);border-color:var(--p-300);
    transform:translateX(4px);
  }
  .question-chip .chip-domain{
    font-size:var(--text-xs);color:var(--color-text-muted);
    display:inline-block;padding:2px 8px;
    background:var(--n-200);border-radius:var(--radius-full);
    margin-right:var(--space-2);
  }

  /* ---------- LOADING ---------- */
  .loading-wrap{display:none;text-align:center;padding:var(--space-12) var(--space-5)}
  .loading-wrap.show{display:block}
  .dot{
    display:inline-block;width:10px;height:10px;border-radius:50%;
    background:var(--p-400);margin:0 4px;
    animation:bounce .6s ease-in-out infinite alternate;
  }
  .dot:nth-child(2){animation-delay:.15s}
  .dot:nth-child(3){animation-delay:.3s}
  @keyframes bounce{from{transform:translateY(0);opacity:.3}to{transform:translateY(-14px);opacity:1}}

  /* ---------- DUAL PANEL ---------- */
  .dual-panel{display:flex;gap:var(--space-5);align-items:flex-start}
  .panel-left{flex:1;min-width:0}
  .panel-right{width:360px;flex-shrink:0;display:none}
  .panel-right.show{display:block}
  .panel-right-inner{
    position:sticky;top:76px;
    max-height:calc(100vh - 180px);overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:var(--n-300) transparent;
  }
  @media(max-width:800px){
    .dual-panel{flex-direction:column}
    .panel-right{width:100%}
    .panel-right-inner{position:static;max-height:none}
  }

  .panel-hd{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:var(--space-3);
  }
  .panel-hd span{font-size:var(--text-lg);font-weight:700;color:var(--color-text)}
  .panel-hd button{
    background:none;border:none;font-size:1.1rem;cursor:pointer;
    color:var(--color-text-muted);padding:var(--space-1) var(--space-2);
    border-radius:var(--radius-sm);transition:all var(--ease-out);
  }
  .panel-hd button:hover{background:var(--n-200);color:var(--color-text)}

  /* ---------- RESULT CARDS ---------- */
  .result-card{
    background:var(--color-surface);
    border-radius:var(--radius-lg);
    padding:var(--space-5) var(--space-6);
    box-shadow:var(--shadow-sm);
    border:1.5px solid var(--color-border);
    animation:cardIn .45s cubic-bezier(0.34,1.56,0.64,1);
    position:relative;
    transition:box-shadow var(--ease-out),transform var(--ease-out);
  }
  .result-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(16px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .result-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:var(--space-4);padding-bottom:var(--space-3);
    border-bottom:1.5px solid var(--color-border);
  }
  .result-header h2{
    font-size:var(--text-lg);font-weight:700;flex:1;padding-right:var(--space-2);
    line-height:var(--leading-heading);color:var(--color-text);
  }
  .result-actions{display:flex;gap:var(--space-1);flex-shrink:0}
  .act-btn{
    width:36px;height:36px;border-radius:var(--radius-sm);
    border:1.5px solid var(--color-border);background:var(--color-surface);
    font-size:0.95rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all var(--ease-bounce);color:var(--color-text-secondary);
  }
  .act-btn:hover{background:var(--p-50);border-color:var(--p-300);color:var(--p-600);transform:scale(1.08)}
  .act-btn:active{transform:scale(.92)}
  .act-btn.liked{background:#fff0ec;border-color:var(--p-300);color:var(--error)}

  /* Card content */
  .result-content{font-size:var(--text-base);line-height:var(--leading-body);color:var(--n-700);word-break:break-word}
  .result-content h3{
    font-size:var(--text-lg);margin:var(--space-5) 0 var(--space-2);
    color:var(--p-600);font-weight:700;line-height:var(--leading-heading);
  }
  .result-content ul,.result-content ol{padding-left:1.5em;margin:var(--space-2) 0}
  .result-content li{margin:var(--space-1) 0}
  .result-content table{
    width:100%;border-collapse:collapse;margin:var(--space-3) 0;
    font-size:var(--text-sm);display:block;overflow-x:auto;
    border-radius:var(--radius-sm);border:1.5px solid var(--color-border);
  }
  .result-content th,.result-content td{
    padding:var(--space-2) var(--space-3);text-align:left;
    border-bottom:1px solid var(--color-border);white-space:nowrap;
  }
  .result-content th{
    background:linear-gradient(135deg,var(--p-50),#fff5f0);color:var(--p-700);font-weight:700;font-size:var(--text-sm);
  }
  .result-content strong{color:var(--p-600);font-weight:700}
  .result-content pre{
    background:var(--n-100);padding:var(--space-3);border-radius:var(--radius-sm);
    overflow-x:auto;font-size:var(--text-sm);line-height:1.6;
  }

  /* ---------- RESULTS GRID ---------- */
  #resultsArea{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
  #resultsArea .result-card{margin-bottom:0}
  #resultsArea .results-empty{grid-column:1/-1}
  @media(max-width:600px){#resultsArea{grid-template-columns:1fr}}

  .results-empty{
    text-align:center;padding:var(--space-16) var(--space-5);
    color:var(--color-text-muted);font-size:var(--text-base);
  }

  /* ---------- WEEK PLAN ---------- */
  .week-card{
    background:var(--color-surface);border-radius:var(--radius-lg);
    padding:var(--space-6);box-shadow:var(--shadow-sm);
    border:1.5px solid var(--color-border);margin-bottom:var(--space-4);
  }
  .week-card h3{font-size:var(--text-xl);margin-bottom:var(--space-4);color:var(--p-600);font-weight:700}
  .week-grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-2);
    overflow-x:auto;
  }
  .week-day{
    text-align:center;padding:var(--space-3) var(--space-2);
    border-radius:var(--radius-md);font-size:var(--text-xs);
    background:var(--n-50);cursor:pointer;

// ===== 领域检测 =====
function detectDomains(query){
  var domains=[],q=query.toLowerCase();
  if(/做法|菜谱|怎么[做煮炖炒蒸炸烤焖卤煸]|烹饪|配方|步骤|食材|怎么做|好吃/.test(q)) domains.push('recipe');
  if(/糖尿|血压|痛风|减脂|增肌|孕期|胃[病炎痛]|肾病|胆[囊固醇]|过敏|便秘|失眠|减肥/.test(q)) domains.push('disease');
  if(/相克|不能.?[同和一起]|禁忌|搭[配对]|中毒|反应|谣言|不能吃/.test(q)) domains.push('toxic');
  if(/营养|功效|好处|成分|维生|矿物|蛋白|脂肪|碳水|热量|含量|适合|推荐|怎么[吃喝]/.test(q)) domains.push('nutrition');
  if(domains.length===0) domains.push('general');
  return domains;
}

// ===== 核心查询（流式） =====
async function ask(){
  var input=document.getElementById('queryInput'),q=input.value.trim();
  if(!q)return;if(q.length>300){toast('问题太长');return;}
  var qu=quota();if(qu.u>=50){toast('今日次数已用完，明天再来吧~');return;}
  var btn=document.getElementById('askBtn'),load=document.getElementById('loading');
  btn.disabled=true;load.classList.add('show');
  streamPaused=false;streamStopped=false;streamCtrl=null;
  useQuota();
  var dislikes=getDislikes();
  if(dislikes.length>0&&detectDomains(q).indexOf('toxic')===-1){
    q=q+'（注意：我不吃这些食物：'+dislikes.join('、')+'，请在回答中排除含有这些食材的搭配或菜谱）';
  }

  // 创建新卡片
  var cardId=addResultCard(q);
  setCardStreaming(cardId);

  var reply='',ok=false;
  for(var attempt=0;attempt<2;attempt++){
    if(attempt>0){
      load.classList.add('show');
      document.getElementById('loadingText').textContent='响应超时，正在重试…';
    }
    var abortCtrl=new AbortController();streamCtrl=abortCtrl;streamPaused=false;
    try{
      var resp=await fetchTO(API,{method:'POST',headers:USE_PROXY?{'Content-Type':'application/json'}:{'Content-Type':'application/json','Authorization':'Bearer '+window._K},body:JSON.stringify({model:'deepseek-chat',max_tokens:1000,stream:true,system:buildSystemPrompt(q),messages:[{role:'user',content:q}]})},15000,abortCtrl);
      if(!resp.ok){var et=await resp.text();throw new Error('AI服务不可用('+resp.status+')');}
      var reader=resp.body.getReader(),decoder=new TextDecoder(),buffer='',started=false;
      reply='';
      while(true){
        var chunk=await reader.read();if(chunk.done)break;
        buffer+=decoder.decode(chunk.value,{stream:true});
        var lines=buffer.split('\n');buffer=lines.pop()||'';
        for(var i=0;i<lines.length;i++){
          var line=lines[i].trim();
          if(!line.startsWith('data: '))continue;
          var jsonStr=line.slice(6);
          if(jsonStr==='[DONE]')continue;
          try{var evt=JSON.parse(jsonStr);
            if(evt.type==='content_block_delta'&&evt.delta&&evt.delta.text){
              reply+=evt.delta.text;
              if(!started){
                started=true;
                load.classList.remove('show');
                currentQuery=q;currentReply='';activeCardId=cardId;
                cardData[cardId].q=q;
              }
              if(!streamPaused){
                currentReply=reply;cardData[cardId].r=reply;
                document.getElementById('content-'+cardId).innerHTML=streamRender(reply);
              }
            }
          }catch(e){}
        }
      }
      if(!reply)throw new Error('无返回内容');
      cardData[cardId].r=reply;currentReply=reply;currentQuery=q;
      updateCardContent(cardId,q,reply);
      ok=true;break;
    }catch(e){
      if(e.name==='AbortError'&&!streamStopped&&attempt===0){continue;}
      if(e.name==='AbortError'){
        if(streamStopped){toast('已停止生成');}
        else{toast('响应超时，请稍后重试');}
      }else{toast(e.message);}
      if(!streamStopped){qu.u=Math.max(0,qu.u-1);localStorage.setItem('fq',JSON.stringify(qu));}
      if(reply){currentReply=reply;cardData[cardId].r=reply;updateCardContent(cardId,q,reply);}
      break;
    }
  }
  if(ok){
    hideCardPauseBtn(cardId);activeCardId=cardId;
    addHist(q,reply);
    var f=getFavs();cardData[cardId].fav=f.some(function(x){return x.q===q;});
    var fb=document.getElementById('favBtn-'+cardId);
    if(fb)fb.textContent=cardData[cardId].fav?'❤️‍🔥':'❤️';
  }else if(!streamStopped&&!reply){
    closeCard(cardId);
  }else if(!streamStopped&&reply){
    cardData[cardId].r=reply;currentReply=reply;
    addHist(currentQuery||q,reply);
    updateCardContent(cardId,currentQuery||q,reply);
    hideCardPauseBtn(cardId);
    toast('生成中断，已保留已有内容');
  }
  btn.disabled=false;load.classList.remove('show');streamCtrl=null;
  // 确保在查询tab
  switchTab('search',document.querySelector('.btm-tab'));
}

// ===== 暂停/停止控制 =====
function togglePause(){
  streamPaused=!streamPaused;
  var cid=activeCardId;
  var btn=cid?document.getElementById('pauseBtn-'+cid):null;
  if(streamPaused){
    if(btn){btn.textContent='▶️';btn.title='继续生成';}
    toast('已暂停 ⏸️');
  }else{
    if(btn){btn.textContent='⏸️';btn.title='暂停生成';}
    if(currentReply&&cid){
      document.getElementById('content-'+cid).innerHTML=parseMD(currentReply);
    }
    toast('继续生成 ▶️');
  }
}
function stopStream(){
  if(streamCtrl){
    streamStopped=true;
    streamCtrl.abort();
    streamCtrl=null;
  }
}

// ===== 热量速查 =====
function toggleCalorie(){
  var el=document.getElementById('panelRight');
  var btn=document.getElementById('calToggleBtn');
  if(el.classList.contains('show')){
    el.classList.remove('show');
    if(btn)btn.classList.remove('cal-on');
  }else{
    el.classList.add('show');
    if(btn)btn.classList.add('cal-on');
  }
}

async function calLookup(){
  var input=document.getElementById('calInput'),q=input.value.trim();if(!q)return;
  q=q+' 的热量、蛋白质、脂肪、碳水化合物各是多少？请用表格列出每100g的营养成分。';
  var load=document.getElementById('calLoading'),card=document.getElementById('calResult');
  var btn=document.getElementById('calBtn');
  load.classList.add('show');card.style.display='none';btn.disabled=true;
  // 确保右栏可见
  var pr=document.getElementById('panelRight');
  if(!pr.classList.contains('show'))toggleCalorie();
  calQuery=input.value.trim();calReply='';
  try{
    var resp=await fetchTO(API,{method:'POST',headers:USE_PROXY?{'Content-Type':'application/json'}:{'Content-Type':'application/json','Authorization':'Bearer '+window._K},body:JSON.stringify({model:'deepseek-chat',max_tokens:500,stream:true,system:SYS.general,messages:[{role:'user',content:q}]})},10000);
    if(!resp.ok)throw new Error('查询失败');
    var reader=resp.body.getReader(),decoder=new TextDecoder(),buffer='',reply='',started=false;
    while(true){
      var chunk=await reader.read();if(chunk.done)break;
      buffer+=decoder.decode(chunk.value,{stream:true});
      var lines=buffer.split('\n');buffer=lines.pop()||'';
      for(var i=0;i<lines.length;i++){
        var line=lines[i].trim();
        if(!line.startsWith('data: '))continue;
        var jsonStr=line.slice(6);
        if(jsonStr==='[DONE]')continue;
        try{var evt=JSON.parse(jsonStr);
          if(evt.type==='content_block_delta'&&evt.delta&&evt.delta.text){
            reply+=evt.delta.text;
            if(!started){started=true;load.classList.remove('show');card.style.display='block';
              document.getElementById('calTitle').innerHTML='🔥 '+esc(calQuery)+' 营养数据';}
            document.getElementById('calContent').innerHTML=streamRender(reply);
          }
        }catch(e){}
      }
    }
    if(!reply)throw new Error('无返回内容');
    calReply=reply;
    document.getElementById('calContent').innerHTML=parseMD(reply);
    document.getElementById('calTitle').innerHTML='🔥 '+esc(calQuery)+' 营养数据';
  }catch(e){
    if(e.name==='AbortError'){toast('请求超时');}
    else{toast(e.message);}
  }
  finally{load.classList.remove('show');btn.disabled=false;}
}

// ===== 周食谱（流式） =====
async function genWeekPlan(q){
  if(!q){q=prompt('想要什么类型的周食谱？如：减脂、增肌、学生便当');if(!q)return;}
  q='请生成一周7天的'+q+'，每天列出早中晚三餐，用表格形式，###每天一个标题，每餐列出具体食物和份量。';
  document.getElementById('loadingText').textContent='正在生成一周食谱…';
  var qu=quota();if(qu.u>=50){toast('今日次数已用完');return;}
  var load=document.getElementById('loading');load.classList.add('show');
  useQuota();
  streamPaused=false;streamStopped=false;streamCtrl=null;
  var abortCtrl=new AbortController();streamCtrl=abortCtrl;
  try{
    var resp=await fetchTO(API,{method:'POST',headers:USE_PROXY?{'Content-Type':'application/json'}:{'Content-Type':'application/json','Authorization':'Bearer '+window._K},body:JSON.stringify({model:'deepseek-chat',max_tokens:1800,stream:true,system:SYS.general,messages:[{role:'user',content:q}]})},15000,abortCtrl);
    if(!resp.ok)throw new Error('生成失败');
    var reader=resp.body.getReader(),decoder=new TextDecoder(),buffer='',reply='';
    while(true){
      var chunk=await reader.read();if(chunk.done)break;
      buffer+=decoder.decode(chunk.value,{stream:true});
      var lines=buffer.split('\n');buffer=lines.pop()||'';
      for(var i=0;i<lines.length;i++){
        var line=lines[i].trim();
        if(!line.startsWith('data: '))continue;
        var jsonStr=line.slice(6);
        if(jsonStr==='[DONE]')continue;
        try{var evt=JSON.parse(jsonStr);
          if(evt.type==='content_block_delta'&&evt.delta&&evt.delta.text){
            reply+=evt.delta.text;
            if(!streamPaused){document.getElementById('weekContent').innerHTML=streamRender(reply);}
          }
        }catch(e){}
      }
    }
    if(!reply)throw new Error('无返回内容');
    document.getElementById('weekContent').innerHTML=parseMD(reply);
    currentQuery=q;currentReply=reply;
    switchTab('week',document.querySelectorAll('.btm-tab')[1]);
    toast('周食谱已生成 ✅','good');
  }catch(e){
    if(e.name==='AbortError'){
      if(streamStopped){toast('已停止生成');}
      else{toast('生成超时，请重试');}
    }else{toast(e.message);}
  }
  finally{load.classList.remove('show');streamCtrl=null;}
}

function shareCard(cardId){
  var cd=cardData[cardId];if(!cd||!cd.r)return;
  currentQuery=cd.q;currentReply=cd.r;
  drawShare(cd.q,cd.r);
}

function shareCalResult(){
  if(!calReply)return;
  currentQuery=calQuery;currentReply=calReply;
  drawShare(calQuery,calReply);
}

function drawShare(q,r){
  var canvas=document.createElement('canvas');canvas.width=600;canvas.height=Math.min(1200,r.length/2+300);
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#fffdf9';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#e85d3a';ctx.font='bold 20px "PingFang SC","Microsoft YaHei"';ctx.fillText('🥗 食光 · 健康饮食助手',24,40);
  ctx.fillStyle='#4a3e2e';ctx.font='16px "PingFang SC","Microsoft YaHei"';ctx.fillText(q.slice(0,50),24,70);
  ctx.strokeStyle='#faf0e0';ctx.beginPath();ctx.moveTo(24,85);ctx.lineTo(576,85);ctx.stroke();
  ctx.fillStyle='#6b5c48';ctx.font='13px "PingFang SC","Microsoft YaHei"';
  var lines=r.split('\n'),y=110;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].replace(/\*\*/g,'').replace(/###/g,'').replace(/#/g,'');
    if(!line.trim()){y+=8;continue;}
    var maxW=552,chars=line.split(''),curLine='';
    for(var j=0;j<chars.length;j++){
      var test=curLine+chars[j];
      if(ctx.measureText(test).width>maxW){ctx.fillText(curLine,24,y);y+=20;curLine=chars[j];}
      else curLine=test;
    }
    if(curLine)ctx.fillText(curLine,24,y);y+=20;
    if(y>canvas.height-40)break;
  }
  ctx.fillStyle='#a89880';ctx.font='11px "PingFang SC","Microsoft YaHei"';ctx.fillText('via 食光 · 健康饮食助手',24,canvas.height-20);
  var img=canvas.toDataURL('image/png');
  document.getElementById('shareImg').src=img;
  document.getElementById('shareOverlay').classList.add('show');
  toast('长按图片即可保存分享 📱','good');
}

// ===== 流式安全渲染 =====
function streamRender(t){
  var h=t;h=h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

// ===== Markdown解析 =====
function parseMD(md){
  var h=md;h=h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  h=h.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/g,function(_,hd,rs){
    var hc=hd.split('|').filter(function(c){return c.trim();}).map(function(c){return '<th>'+c.trim()+'</th>';}).join('');
    var rr=rs.trim().split('\n').map(function(r){
      return '<tr>'+r.split('|').filter(function(c){return c.trim();}).map(function(c){return '<td>'+c.trim()+'</td>';}).join('')+'</tr>';
    }).join('');
    return '<table><thead><tr>'+hc+'</tr></thead><tbody>'+rr+'</tbody></table>';
  });
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>');
  h=h.replace(/^[-*] (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ol>$1</ol>');
  h=h.replace(/\n\n+/g,'</p><p>');
  h='<p>'+h+'</p>';
  h=h.replace(/<p>\s*<\/p>/g,'');h=h.replace(/<p><h/g,'<h').replace(/<\/h(\d)><\/p>/g,'</h$1>');
  h=h.replace(/<p><table>/g,'<table>').replace(/<\/table><\/p>/g,'</table>');
  h=h.replace(/<p><ol>/g,'<ol>').replace(/<\/ol><\/p>/g,'</ol>');
  return h;
}
