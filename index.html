<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>食光 · 健康饮食助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #4ade80; --green-dark: #22c55e; --orange: #fb923c;
    --bg: #faf7f2; --card: #ffffff; --text: #3d3a35; --text-light: #78746d;
    --border: #e8e3db;
  }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: rgba(255,255,255,0.88);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-size: 18px; font-weight: 700;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; letter-spacing: 1px;
  }
  .nav-links { display: flex; gap: 14px; font-size: 13px; color: var(--text-light); }
  .nav-links span { cursor: pointer; transition: color 0.2s; }
  .nav-links span:hover, .nav-links span.active { color: var(--green-dark); font-weight: 600; }

  .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  .hero { text-align: center; padding: 28px 0 22px; }
  .hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .hero .accent {
    background: linear-gradient(135deg, #4ade80, #22c55e, #16a34a);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p { color: var(--text-light); font-size: 14px; line-height: 1.6; }

  .search-box {
    background: var(--card); border-radius: 18px; padding: 20px 18px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.035); margin-bottom: 16px;
  }
  .input-row { display: flex; gap: 10px; }
  .input-row input {
    flex: 1; padding: 12px 16px; border: 2px solid var(--border);
    border-radius: 12px; font-size: 15px; font-family: inherit;
    background: var(--bg); outline: none; transition: border-color 0.2s;
  }
  .input-row input:focus { border-color: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,0.1); }
  .input-row button {
    padding: 12px 22px; background: linear-gradient(135deg, #4ade80, #22c55e);
    color: white; border: none; border-radius: 12px; font-size: 15px;
    font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .input-row button:active { transform: scale(0.96); }
  .input-row button:disabled { opacity: 0.5; pointer-events: none; }

  .quick-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .quick-tag {
    padding: 6px 12px; border-radius: 100px; font-size: 12px;
    border: 1px solid var(--border); background: white; cursor: pointer;
    color: var(--text-light); font-family: inherit;
    transition: all 0.2s; -webkit-tap-highlight-color: transparent;
  }
  .quick-tag:active { border-color: #4ade80; color: #22c55e; background: #f0fdf4; }

  .loading-wrap { display: none; text-align: center; padding: 36px; }
  .loading-wrap.show { display: block; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #4ade80; margin: 0 3px;
    animation: bounce 0.6s ease-in-out infinite alternate;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    from { transform: translateY(0); opacity: 0.4; }
    to   { transform: translateY(-10px); opacity: 1; }
  }

  .result-card {
    background: var(--card); border-radius: 18px; padding: 24px 18px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.035); display: none;
    animation: fadeIn 0.35s ease;
  }
  .result-card.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .result-card h2 {
    font-size: 17px; margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .result-content { font-size: 14px; line-height: 1.8; color: #4a4540; word-break: break-word; }
  .result-content h3 { font-size: 15px; margin: 18px 0 8px; color: #22c55e; }
  .result-content ul, .result-content ol { padding-left: 18px; margin: 6px 0; }
  .result-content li { margin: 3px 0; }
  .result-content table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
  .result-content th, .result-content td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .result-content th { background: #f0fdf4; color: #22c55e; font-weight: 600; }
  .result-content strong { color: #22c55e; }
  .result-content pre { background: #f5f5f0; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }

  .cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 480px) {
    .cards-row { grid-template-columns: 1fr; }
    .hero h1 { font-size: 24px; }
  }
  .feature-card {
    background: var(--card); border-radius: 14px; padding: 20px;
    box-shadow: 0 1px 10px rgba(0,0,0,0.025);
    cursor: pointer; text-align: center;
    transition: all 0.2s; -webkit-tap-highlight-color: transparent;
  }
  .feature-card:active { transform: scale(0.97); background: #fafdf8; }
  .feature-card .icon { font-size: 34px; margin-bottom: 8px; }
  .feature-card h3 { font-size: 15px; margin-bottom: 4px; }
  .feature-card p { font-size: 12px; color: var(--text-light); line-height: 1.5; }

  .footer { text-align: center; padding: 28px; color: var(--text-light); font-size: 12px; }

  .error-banner {
    background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
    padding: 10px 14px; border-radius: 10px; margin-top: 10px;
    font-size: 13px; display: none;
  }
  .error-banner.show { display: block; }
</style>
</head>
<body>

<nav class="nav">
  <div class="logo">🥗 食光</div>
  <div class="nav-links">
    <span class="active" onclick="switchTab('pair', this)">搭配</span>
    <span onclick="switchTab('recipe', this)">菜谱</span>
    <span onclick="switchTab('nutrition', this)">营养</span>
  </div>
</nav>

<div class="container">
  <div class="hero">
    <h1>吃得<span class="accent">明白</span>，活得<span class="accent">健康</span></h1>
    <p>告诉我你想吃什么，AI帮你搭配最健康的方案</p>
  </div>

  <div class="search-box">
    <div class="input-row">
      <input id="queryInput" type="text" placeholder="比如：早餐牛奶鸡蛋配什么好？"
        onkeydown="if(event.key==='Enter')ask()" autocomplete="off" />
      <button id="askBtn" onclick="ask()">🔍 提问</button>
    </div>
    <div class="quick-tags" id="quickTags"></div>
    <div class="error-banner" id="errorBanner"></div>
  </div>

  <div class="loading-wrap" id="loading">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <p style="color:var(--text-light);margin-top:8px;font-size:13px;">AI正在为你搭配...</p>
  </div>

  <div class="result-card" id="resultCard">
    <h2 id="resultTitle"></h2>
    <div class="result-content" id="resultContent"></div>
  </div>

  <div class="cards-row">
    <div class="feature-card" onclick="quickAsk('我今天早餐午餐晚餐分别该怎么搭配才健康？')">
      <div class="icon">📋</div><h3>一日三餐搭配</h3><p>全天健康饮食规划</p>
    </div>
    <div class="feature-card" onclick="quickAsk('减脂期应该怎么吃？给我完整的方案')">
      <div class="icon">💪</div><h3>减脂饮食方案</h3><p>低卡不挨饿的科学吃法</p>
    </div>
    <div class="feature-card" onclick="quickAsk('番茄炒蛋怎么做？详细步骤和技巧')">
      <div class="icon">🍳</div><h3>家常菜谱</h3><p>手把手教你做每道菜</p>
    </div>
    <div class="feature-card" onclick="quickAsk('增强免疫力的食物搭配建议')">
      <div class="icon">🛡️</div><h3>增强免疫力</h3><p>吃出好身体的搭配</p>
    </div>
  </div>

  <div class="footer">食光 · 健康饮食助手</div>
</div>

<script>
// ===== 配置 =====
// API Key 不再写在前端！请求发到服务端代理 /api/proxy
const API_BASE = '/.netlify/functions/proxy';

const SYSTEM_PROMPT = `你是一个专业的健康饮食顾问。回答规则：
1. 食物搭配问题：用表格列出，包含"食物组合 | 营养优势 | 适合场景"
2. 菜谱问题：分步骤列出，包含食材用量、烹饪时间、关键技巧
3. 营养知识：简洁明了，重点加粗
4. 用 ### 小标题分隔，重点用 **加粗**
5. 最后加上一个 💡 小贴士
6. 语言亲切自然，像朋友在给你建议`;

// 快捷标签
const quickTags = ['早餐怎么搭','减脂晚餐','增肌吃什么','番茄炒蛋','抗疲劳食物','美容养颜','失眠吃什么','学生便当'];
const tagsDiv = document.getElementById('quickTags');
quickTags.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'quick-tag'; btn.textContent = tag;
  btn.onclick = () => quickAsk(tag); tagsDiv.appendChild(btn);
});

let currentTab = 'pair';

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.nav-links span').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  const ph = { pair:'早餐牛奶鸡蛋配什么好？', recipe:'宫保鸡丁怎么做？', nutrition:'运动后吃什么恢复快？' };
  document.getElementById('queryInput').placeholder = '比如：' + ph[tab];
  document.getElementById('queryInput').focus();
}

function quickAsk(q) {
  document.getElementById('queryInput').value = q;
  ask();
}

async function ask() {
  const input = document.getElementById('queryInput');
  const query = input.value.trim();
  if (!query) return;
  if (query.length > 500) {
    showError('问题太长了，请控制在500字以内哦');
    return;
  }

  const btn = document.getElementById('askBtn');
  const loading = document.getElementById('loading');
  const resultCard = document.getElementById('resultCard');
  const resultTitle = document.getElementById('resultTitle');
  const resultContent = document.getElementById('resultContent');
  const errorBanner = document.getElementById('errorBanner');

  btn.disabled = true;
  loading.classList.add('show');
  resultCard.classList.remove('show');
  errorBanner.classList.remove('show');

  try {
    const resp = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user', content: query }
        ]
      })
    });

    if (resp.status === 429) {
      throw new Error('提问太频繁了，请稍等一会儿再问～');
    }
    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error || `服务器开小差了（${resp.status}），请重试`);
    }

    const data = await resp.json();
    let text = data.reply || '';
    if (!text) throw new Error('AI没有返回内容，请换个问法试试');

    resultTitle.innerHTML = '🥗 ' + query.slice(0, 28) + (query.length > 28 ? '...' : '');
    resultContent.innerHTML = parseMarkdown(text);
    resultCard.classList.add('show');
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
    loading.classList.remove('show');
  }
}

function showError(msg) {
  const banner = document.getElementById('errorBanner');
  banner.textContent = '⚠️ ' + msg;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 5000);
}

// 简易 Markdown 解析
function parseMarkdown(md) {
  let html = md;
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  html = html.replace(/\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/g,(_,h,r)=>{
    const hc = h.split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('');
    const rr = r.trim().split('\n').map(row=>{
      const cc = row.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('');
      return `<tr>${cc}</tr>`;
    }).join('');
    return `<table><thead><tr>${hc}</tr></thead><tbody>${rr}</tbody></table>`;
  });
  html = html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  html = html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  html = html.replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>');
  html = html.replace(/^[-*] (.+)$/gm,'<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ol>$1</ol>');
  html = html.replace(/\n\n+/g,'</p><p>');
  html = '<p>'+html+'</p>';
  html = html.replace(/<p>\s*<\/p>/g,'');
  html = html.replace(/<p><h/g,'<h').replace(/<\/h(\d)><\/p>/g,'</h$1>');
  html = html.replace(/<p><table>/g,'<table>').replace(/<\/table><\/p>/g,'</table>');
  html = html.replace(/<p><ol>/g,'<ol>').replace(/<\/ol><\/p>/g,'</ol>');
  return html;
}
</script>
</body>
</html>
